<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ICC Ref" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>مرجع المحكمة الجنائية الدولية</title>
    <meta name="description" content="مرجع قانوني أنيق يضم متطلبات ووثائق المحكمة الجنائية الدولية مصمم على شكل أدراج خشبية." />
    <meta property="og:title" content="مرجع المحكمة الجنائية الدولية" />
    <meta property="og:description" content="مرجع قانوني أنيق يضم متطلبات ووثائق المحكمة الجنائية الدولية مصمم على شكل أدراج خشبية." />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress benign Vite development WebSocket/HMR disconnect logs (HMR is disabled by platform design in AI Studio)
      const isBenignViteLog = (args) => {
        return args.some(arg => {
          if (typeof arg === 'string') {
            return arg.includes('[vite]') || arg.includes('websocket') || arg.includes('WebSocket') || arg.includes('failed to connect');
          }
          if (arg && typeof arg.message === 'string') {
            return arg.message.includes('[vite]') || arg.message.includes('websocket');
          }
          return false;
        });
      };

      const _origConsoleError = console.error;
      console.error = function (...args) {
        if (isBenignViteLog(args)) return;
        _origConsoleError.apply(console, args);
      };

      const _origConsoleWarn = console.warn;
      console.warn = function (...args) {
        if (isBenignViteLog(args)) return;
        _origConsoleWarn.apply(console, args);
      };

      const _origConsoleLog = console.log;
      console.log = function (...args) {
        if (isBenignViteLog(args)) return;
        _origConsoleLog.apply(console, args);
      };

      const _origConsoleDebug = console.debug;
      console.debug = function (...args) {
        if (isBenignViteLog(args)) return;
        _origConsoleDebug.apply(console, args);
      };

      window.addEventListener('error', function (e) {
        if (e && e.message && (e.message.includes('[vite]') || e.message.includes('websocket'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });

      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && typeof e.reason.message === 'string' && (e.reason.message.includes('[vite]') || e.reason.message.includes('websocket'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });

      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
