    <script>
      // Filter benign Vite development WebSocket logs that trigger false-positive error notifications
      const _origConsoleError = console.error;
      console.error = function (...args) {
        if (args.length > 0 && typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('websocket') || args[0].includes('WebSocket'))) {
          return;
        }
        _origConsoleError.apply(console, args);
      };
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
