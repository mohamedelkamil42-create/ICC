<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      // Suppress benign Vite development WebSocket/HMR disconnect logs (HMR is disabled by platform design in AI Studio)
      (function() {
        const isBenignViteLog = (args) => {
          return args.some(arg => {
            if (!arg) return false;
            if (typeof arg === 'string') {
              return arg.includes('[vite]') || arg.includes('websocket') || arg.includes('WebSocket') || arg.includes('failed to connect');
            }
            if (typeof arg.message === 'string') {
              return arg.message.includes('[vite]') || arg.message.includes('websocket') || arg.message.includes('failed to connect');
            }
            if (typeof arg.reason === 'string') {
              return arg.reason.includes('[vite]') || arg.reason.includes('websocket');
            }
            return false;
          });
        };

        const _origConsoleError = console.error;
        console.error = function (...args) {
          if (isBenignViteLog(args)) return;
          _origConsoleError.apply(console, args);
        };

        const _origConsoleWarn = console.warn;
        console.warn = function (...args) {
          if (isBenignViteLog(args)) return;
          _origConsoleWarn.apply(console, args);
        };

        const _origConsoleLog = console.log;
        console.log = function (...args) {
          if (isBenignViteLog(args)) return;
          _origConsoleLog.apply(console, args);
        };

        const _origConsoleDebug = console.debug;
        console.debug = function (...args) {
          if (isBenignViteLog(args)) return;
          _origConsoleDebug.apply(console, args);
        };

        const _origConsoleInfo = console.info;
        console.info = function (...args) {
          if (isBenignViteLog(args)) return;
          _origConsoleInfo.apply(console, args);
        };

        window.addEventListener('error', function (e) {
          if (e && ((e.message && (e.message.includes('[vite]') || e.message.includes('websocket'))) || (e.filename && e.filename.includes('@vite/client')))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          if (e && e.reason && typeof e.reason.message === 'string' && (e.reason.message.includes('[vite]') || e.reason.message.includes('websocket'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        // Intercept Vite HMR WebSocket connection gracefully to prevent console red errors in sandbox iframe
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          window.WebSocket = function (url, protocols) {
            if (typeof protocols === 'string' && protocols === 'vite-hmr') {
              const fakeWs = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                url: String(url),
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (type === 'open') {
                    setTimeout(() => {
                      if (typeof listener === 'function') listener(new Event('open'));
                    }, 0);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              setTimeout(() => {
                if (typeof fakeWs.onopen === 'function') {
                  fakeWs.onopen(new Event('open'));
                }
              }, 0);
              return fakeWs;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }

        window.$RefreshReg$ = () => {};
        window.$RefreshSig$ = () => (type) => type;
        window.__vite_plugin_react_preamble_installed__ = true;
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
